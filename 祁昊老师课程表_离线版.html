<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173f37">
  <title>祁昊老师的课程表｜2026 秋季学期</title>
  <style>
    :root {
      --ink: #17332f;
      --green: #173f37;
      --muted: #6d7874;
      --line: #d9ddd5;
      --paper: #fffdf8;
      --canvas: #f4f3ed;
      --orange: #b96b42;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: var(--ink);
      background: var(--canvas);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--canvas); }
    button, select { font: inherit; }
    button { cursor: pointer; }
    .shell {
      min-height: 100vh;
      padding: 40px clamp(14px, 4vw, 60px) 34px;
      background:
        linear-gradient(rgba(23,63,55,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23,63,55,.035) 1px, transparent 1px),
        var(--canvas);
      background-size: 28px 28px;
    }
    .masthead, .toolbar, .panel, .legend { width: min(100%, 1720px); margin-inline: auto; }
    .masthead { display: flex; align-items: flex-end; justify-content: space-between; gap: 26px; margin-bottom: 26px; }
    .eyebrow { margin: 0 0 10px; color: var(--orange); font-size: 12px; font-weight: 800; letter-spacing: .16em; }
    h1 { margin: 0; color: #153a32; font-family: "Songti SC", SimSun, serif; font-size: clamp(34px, 4vw, 58px); line-height: 1.06; letter-spacing: -.04em; }
    .subtitle { margin: 11px 0 0; color: var(--muted); font-size: 14px; letter-spacing: .06em; }
    .week-card { display: flex; align-items: center; gap: 14px; min-width: 270px; padding: 16px 18px; border-radius: 18px; color: #fff; background: var(--green); box-shadow: 0 14px 34px rgba(23,63,55,.18); }
    .week-card__icon { display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid rgba(255,255,255,.24); border-radius: 12px; color: #f0b98f; font-size: 21px; }
    .week-card small, .week-card strong { display: block; }
    .week-card small { color: #bcd0c9; font-size: 11px; letter-spacing: .07em; }
    .week-card strong { margin: 2px 0; font-family: "Songti SC", SimSun, serif; font-size: 21px; }
    .week-card .range { color: #e7efe9; font-size: 12px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 15px; padding: 12px 14px; border: 1px solid rgba(23,63,55,.1); border-radius: 17px; background: rgba(255,253,248,.95); box-shadow: 0 8px 22px rgba(43,60,55,.06); }
    .week-control { display: flex; align-items: center; gap: 9px; }
    .nav-btn { display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 12px; color: var(--green); background: #fff; font-size: 24px; line-height: 1; }
    .nav-btn:disabled { cursor: not-allowed; opacity: .35; }
    select { width: min(330px, 56vw); height: 40px; padding: 0 38px 0 13px; border: 1px solid #cfd6ce; border-radius: 12px; color: var(--ink); background: #fff; font-size: 14px; font-weight: 750; }
    .metrics { display: flex; align-items: center; gap: 10px; padding-right: 6px; color: #60716c; font-size: 13px; font-weight: 650; }
    .metrics i { width: 4px; height: 4px; border-radius: 50%; background: #d48a5e; }
    .panel { overflow: hidden; border: 1px solid rgba(23,63,55,.12); border-radius: 24px; background: var(--paper); box-shadow: 0 22px 58px rgba(44,61,56,.1); }
    .panel-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; padding: 23px 25px 19px; border-bottom: 1px solid #e2e3dc; }
    .week-code { color: var(--orange); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: 800; letter-spacing: .14em; }
    h2 { margin: 4px 0 0; color: #1c3f37; font-family: "Songti SC", SimSun, serif; font-size: 24px; }
    .hint { margin: 0; color: #89938f; font-size: 12px; text-align: right; }
    .scroller { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-color: #afbab5 transparent; }
    .schedule { display: grid; grid-template-columns: 100px repeat(7,minmax(145px,1fr)); grid-template-rows: 62px repeat(6,minmax(142px,auto)); min-width: 1125px; padding: 0 12px 12px; background: var(--paper); }
    .corner, .day-head { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #dde1da; background: rgba(255,253,248,.98); }
    .corner { left: 0; z-index: 7; flex-direction: column; color: #84918d; font-size: 11px; font-weight: 750; }
    .corner b { color: var(--green); font-size: 16px; }
    .day-head { flex-direction: column; gap: 3px; }
    .day-head strong { color: #234a41; font-size: 13px; }
    .day-head span { color: #929b97; font-size: 11px; }
    .time-head { position: sticky; left: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 5px 6px 0 0; border-right: 1px dashed #daddd6; color: #6d7e79; background: var(--paper); text-align: center; }
    .time-head span { margin-bottom: 6px; font-size: 11px; font-weight: 750; }
    .time-head b, .time-head small { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.35; }
    .time-head small { color: #a0a7a4; }
    .empty { min-height: 142px; margin: 5px 3px 0; border: 1px dashed #e2e3dd; border-radius: 13px; background: rgba(247,247,242,.65); }
    .course-pos { z-index: 2; min-height: 0; padding: 5px 3px 0; }
    .course { display: flex; flex-direction: column; height: 100%; min-height: 132px; overflow: hidden; padding: 12px 11px 11px; border: 1px solid var(--border); border-left-width: 4px; border-radius: 13px; color: var(--fg); background: var(--bg); box-shadow: 0 5px 12px rgba(39,55,51,.07); }
    .course-time { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; font-weight: 800; opacity: .78; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
    .course h3 { margin: 0 0 10px; font-size: 14px; font-weight: 900; line-height: 1.25; }
    .details { display: grid; gap: 5px; margin-top: auto; }
    .details p { margin: 0; font-size: 10px; font-weight: 650; line-height: 1.35; }
    .details b { display: inline-block; width: 17px; opacity: .7; }
    .note { margin: 7px 0 0; padding-top: 7px; border-top: 1px solid color-mix(in srgb,var(--border) 35%,transparent); font-size: 9px; font-weight: 700; }
    .legend { display: flex; align-items: flex-start; gap: 20px; padding: 19px 5px 0; color: #65736f; font-size: 12px; }
    .legend > strong { flex: 0 0 auto; color: #24483f; }
    .legend-items { display: flex; flex-wrap: wrap; gap: 9px 17px; }
    .legend-items span { display: inline-flex; align-items: center; gap: 7px; }
    .legend-items i { width: 8px; height: 8px; border-radius: 50%; }
    .offline-badge { position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); z-index: 20; padding: 7px 10px; border: 1px solid rgba(23,63,55,.14); border-radius: 999px; color: #45615a; background: rgba(255,253,248,.94); box-shadow: 0 5px 16px rgba(23,63,55,.1); font-size: 10px; font-weight: 750; }
    @media (max-width: 820px) {
      .shell { padding: 27px 12px 66px; }
      .masthead { display: grid; gap: 20px; margin-bottom: 20px; }
      h1 { font-size: 37px; }
      .week-card { width: 100%; min-width: 0; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .week-control { width: 100%; }
      select { min-width: 0; width: auto; flex: 1; }
      .metrics { justify-content: center; padding: 2px 0 0; }
      .panel-head { padding: 19px; }
      .hint { max-width: 150px; line-height: 1.45; }
      .schedule { grid-template-columns: 86px repeat(7,minmax(121px,1fr)); grid-template-rows: 56px repeat(6,minmax(130px,auto)); min-width: 925px; padding-inline: 7px; }
      .empty { min-height: 130px; }
      .course { min-height: 120px; }
      .legend { display: grid; gap: 9px; }
    }
    @media print {
      .shell { padding: 10px; background: #fff; }
      .toolbar, .legend, .offline-badge { display: none; }
      .panel, .week-card { box-shadow: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <p class="eyebrow">佛山大学 · 动物科技学院</p>
        <h1>祁昊老师的课程表</h1>
        <p class="subtitle">2026—2027 学年第一学期</p>
      </div>
      <div class="week-card" aria-live="polite">
        <span class="week-card__icon" aria-hidden="true">▦</span>
        <div><small>当前显示</small><strong id="currentWeek">第 1 周</strong><span class="range" id="weekRange"></span></div>
      </div>
    </header>

    <section class="toolbar" aria-label="周次选择">
      <div class="week-control">
        <button class="nav-btn" id="previousWeek" type="button" aria-label="查看上一周">‹</button>
        <select id="weekSelect" aria-label="选择教学周"></select>
        <button class="nav-btn" id="nextWeek" type="button" aria-label="查看下一周">›</button>
      </div>
      <div class="metrics"><span id="meetingCount"></span><i aria-hidden="true"></i><span id="courseCount"></span></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div><span class="week-code" id="weekCode">WEEK 01</span><h2>本周课程安排</h2></div>
        <p class="hint">完整周表 · 手机上左右滑动查看</p>
      </div>
      <div class="scroller" role="region" aria-label="本周课程表，可横向滑动" tabindex="0">
        <div class="schedule" id="schedule"></div>
      </div>
    </section>

    <footer class="legend"><strong>课程颜色</strong><div class="legend-items" id="legend"></div></footer>
    <div class="offline-badge">✓ 离线可用 · 无需网络</div>
  </main>

  <script>
    const TOTAL_WEEKS = 16;
    const FIRST_WEEK_START = Date.UTC(2026, 8, 6);
    const DAY_MS = 86400000;
    const days = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
    const slots = [
      { name: "第一大节", start: "08:00", end: "09:25" },
      { name: "第二大节", start: "09:40", end: "11:05" },
      { name: "第三大节", start: "13:30", end: "14:55" },
      { name: "第四大节", start: "15:10", end: "16:35" },
      { name: "第五大节", start: "18:30", end: "19:55" },
      { name: "第六大节", start: "20:05", end: "21:30" }
    ];
    const themes = {
      "生物化学": ["#FCE8DF", "#D26C4D", "#6F3022"],
      "动物生物化学": ["#DDF1EC", "#2F8978", "#1D5D50"],
      "动物机能学实验技术": ["#E8E8F8", "#7373B5", "#43437C"],
      "畜牧学基础": ["#FFF0C9", "#BA861F", "#6F4C08"],
      "实验安全教育": ["#E3EEF9", "#4E7EA9", "#315C80"],
      "生物化学实验": ["#F2E4F3", "#9867A0", "#643E6B"]
    };
    const weeks = (text) => text.split(",").flatMap(part => {
      if (!part.includes("-")) return [Number(part)];
      const [start, end] = part.split("-").map(Number);
      return Array.from({ length: end - start + 1 }, (_, index) => start + index);
    });
    const meetings = [
      ["sun-functional-5","动物机能学实验技术",0,1,4,[9],"B8-104","25动物医学5班",30],
      ["mon-biochem","生物化学",1,1,1,weeks("1-4,6-16"),"C7-103","25生物工程1班",31],
      ["mon-husbandry-am","畜牧学基础",1,2,1,[10],"C7-213","24动物医学1班",33],
      ["mon-husbandry-pm","畜牧学基础",1,3,1,weeks("1-4,6-16"),"C7-308","24动物医学2班",34],
      ["mon-safety","实验安全教育",1,5,1,weeks("9-16"),"B7-205","25动物科学1班",26],
      ["tue-animal-biochem","动物生物化学",2,1,1,weeks("1-14"),"C7-214","25动物医学5-6班、人工智能+交叉创新班",61],
      ["tue-safety","实验安全教育",2,2,1,weeks("9-16"),"B7-205","25动物科学2班",28],
      ["tue-husbandry-pm","畜牧学基础",2,3,1,weeks("1-16"),"C7-213","24动物医学2班",34],
      ["tue-husbandry-late","畜牧学基础",2,4,1,weeks("1-13"),"C7-212","24动物医学1班",33],
      ["tue-biochem-lab","生物化学实验",2,5,2,weeks("3-12"),"B8-104","25生物工程1班",31,"8学时机动安排"],
      ["wed-functional","动物机能学实验技术",3,1,2,weeks("3-8"),"B8-104","25动物医学6班、人工智能+交叉创新班",31],
      ["wed-safety","实验安全教育",3,2,1,[16],"B7-205","25动物科学2班",28],
      ["thu-husbandry-special","畜牧学基础",4,1,1,[16],"C7-205","24动物医学2班",34],
      ["thu-functional","动物机能学实验技术",4,1,2,weeks("3,5-9"),"B8-104","25动物医学5班",30],
      ["thu-safety","实验安全教育",4,3,1,weeks("9-11,13-16"),"B7-205","25动物科学1班",26],
      ["thu-husbandry-late","畜牧学基础",4,4,1,weeks("1-3,5-8"),"C7-211","24动物医学1班",33],
      ["thu-biochem-night","生物化学",4,5,1,weeks("1-3,5-11,13-15"),"C7-103","25生物工程1班",31],
      ["fri-animal-biochem","动物生物化学",5,2,1,weeks("1-2,5-11"),"C7-302","25动物医学5-6班、人工智能+交叉创新班",61],
      ["fri-safety-special","实验安全教育",5,2,1,[16],"B7-205","25动物科学1班",26],
      ["fri-safety","实验安全教育",5,3,1,weeks("9-11,13-16"),"B7-205","25动物科学2班",28],
      ["sat-functional-6","动物机能学实验技术",6,1,4,[9],"B8-104","25动物医学6班、人工智能+交叉创新班",31]
    ].map(item => ({ id:item[0], course:item[1], day:item[2], slot:item[3], span:item[4], weeks:item[5], room:item[6], className:item[7], students:item[8], note:item[9] }));

    let currentWeek = 1;
    const el = (tag, className, html) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (html !== undefined) node.innerHTML = html;
      return node;
    };
    const dayDate = (week, day) => new Date(FIRST_WEEK_START + ((week - 1) * 7 + day) * DAY_MS);
    const monthDay = date => `${date.getUTCMonth()+1}月${date.getUTCDate()}日`;
    const rangeText = week => {
      const start = dayDate(week, 0), end = dayDate(week, 6);
      return `${start.getUTCFullYear()}年${monthDay(start)}—${monthDay(end)}`;
    };
    const meetingTime = meeting => `${slots[meeting.slot-1].start}–${slots[meeting.slot+meeting.span-2].end}`;

    function courseCard(meeting) {
      const [bg, border, fg] = themes[meeting.course];
      const card = el("article", "course");
      card.style.cssText = `--bg:${bg};--border:${border};--fg:${fg}`;
      card.setAttribute("aria-label", `${meeting.course}，${meetingTime(meeting)}，${meeting.room}，${meeting.className}`);
      card.innerHTML = `
        <div class="course-time"><span class="dot"></span><span>${meetingTime(meeting)}</span></div>
        <h3>${meeting.course}</h3>
        <div class="details">
          <p><b>⌖</b>${meeting.room}</p>
          <p><b>◇</b>${meeting.className}</p>
          <p><b>♙</b>${meeting.students}人</p>
        </div>
        ${meeting.note ? `<p class="note">备注：${meeting.note}</p>` : ""}`;
      return card;
    }

    function render() {
      const visible = meetings.filter(meeting => meeting.weeks.includes(currentWeek));
      document.getElementById("currentWeek").textContent = `第 ${currentWeek} 周`;
      document.getElementById("weekRange").textContent = rangeText(currentWeek);
      document.getElementById("weekCode").textContent = `WEEK ${String(currentWeek).padStart(2,"0")}`;
      document.getElementById("meetingCount").textContent = `${visible.length} 个上课时段`;
      document.getElementById("courseCount").textContent = `${new Set(visible.map(item => item.course)).size} 门课程`;
      document.getElementById("weekSelect").value = String(currentWeek);
      document.getElementById("previousWeek").disabled = currentWeek === 1;
      document.getElementById("nextWeek").disabled = currentWeek === TOTAL_WEEKS;

      const schedule = document.getElementById("schedule");
      schedule.replaceChildren();
      schedule.append(el("div", "corner", "<b>◷</b><span>上课时间</span>"));
      days.forEach((day, index) => {
        const date = dayDate(currentWeek, index);
        schedule.append(el("div", "day-head", `<strong>${day}</strong><span>${date.getUTCMonth()+1}/${date.getUTCDate()}</span>`));
      });
      slots.forEach((slot, index) => {
        const head = el("div", "time-head", `<span>${slot.name}</span><b>${slot.start}</b><small>${slot.end}</small>`);
        head.style.gridColumn = "1";
        head.style.gridRow = String(index + 2);
        schedule.append(head);
      });
      days.forEach((day, dayIndex) => slots.forEach((slot, slotIndex) => {
        const cell = el("div", "empty");
        cell.style.gridColumn = String(dayIndex + 2);
        cell.style.gridRow = String(slotIndex + 2);
        cell.setAttribute("aria-hidden", "true");
        schedule.append(cell);
      }));
      visible.forEach(meeting => {
        const position = el("div", "course-pos");
        position.style.gridColumn = String(meeting.day + 2);
        position.style.gridRow = `${meeting.slot + 1} / span ${meeting.span}`;
        position.append(courseCard(meeting));
        schedule.append(position);
      });
    }

    const select = document.getElementById("weekSelect");
    for (let week = 1; week <= TOTAL_WEEKS; week++) {
      const option = document.createElement("option");
      option.value = String(week);
      option.textContent = `第 ${week} 周 · ${rangeText(week)}`;
      select.append(option);
    }
    Object.entries(themes).forEach(([course, theme]) => {
      document.getElementById("legend").append(el("span", "", `<i style="background:${theme[1]}"></i>${course}`));
    });
    select.addEventListener("change", event => { currentWeek = Number(event.target.value); render(); });
    document.getElementById("previousWeek").addEventListener("click", () => { currentWeek = Math.max(1, currentWeek - 1); render(); });
    document.getElementById("nextWeek").addEventListener("click", () => { currentWeek = Math.min(TOTAL_WEEKS, currentWeek + 1); render(); });
    render();
  </script>
</body>
</html>
